buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.4.2'
    }
}

plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "gfm_recode" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// After clean, dev launch must rebuild client outputs or Fabric crashes (missing build/resources/client).
tasks.register("prepareModDev") {
    dependsOn("processResources", "processClientResources", "compileJava", "compileClientJava")
}

afterEvaluate {
    tasks.named("runClient").configure {
        dependsOn("prepareModDev")
    }
    tasks.configureEach { task ->
        if (task.name.contains("devlaunchinjector")) {
            task.dependsOn("prepareModDev")
        }
    }
}

allprojects {
    tasks.withType(JavaCompile).configureEach {
        it.sourceCompatibility = '21'
        it.targetCompatibility = '21'
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
    maven { url "https://cursemaven.com" }
}

dependencies {
    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modClientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MCEF library with Minecraft-native off-screen Chromium rendering.
    modImplementation "curse.maven:mcef-keksuccinos-fork-1366156:7587812"
    include "curse.maven:mcef-keksuccinos-fork-1366156:7587812"

    implementation include("io.github.kawaxte:discord-rpc:20230409")

    // imgui-java — app artifact liefert ImGuiNativeLibLoader (laedt natives aus JAR, unabhaengig von java.library.path)
    implementation include("io.github.spair:imgui-java-binding:1.89.0")
    implementation include("io.github.spair:imgui-java-lwjgl3:1.89.0")
    implementation include("io.github.spair:imgui-java-app:1.89.0")
    runtimeOnly include("io.github.spair:imgui-java-natives-windows:1.89.0")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {}
}

// ─── ProGuard Obfuskierung ───────────────────────────────────────────────────
task obfuscate(type: proguard.gradle.ProGuardTask, dependsOn: remapJar) {
    injars  tasks.remapJar.archiveFile
    outjars "${buildDir}/libs/${archives_base_name}-${version}-obf.jar"

    libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod"
    libraryjars "${System.getProperty('java.home')}/jmods/java.desktop.jmod"

    dontshrink
    dontoptimize
    dontusemixedcaseclassnames
    dontwarn

    // Mixins NIE obfuskieren - sonst crasht Fabric
    keep 'class de.glutenfreierkeks.gfm_recode.mixin.** { *; }'

    // Fabric Entrypoints behalten
    keep 'class de.glutenfreierkeks.gfm_recode.GfmRecode { *; }'
    keep 'class de.glutenfreierkeks.gfm_recode.GfmRecodeClient { *; }'

    keepattributes 'RuntimeVisibleAnnotations'
}

task skidfuscate(type: Exec, dependsOn: obfuscate) {
    def inputJar  = "${buildDir}/libs/${archives_base_name}-${version}-obf.jar"
    def outputJar = "${buildDir}/libs/${archives_base_name}-${version}-final.jar"
    def skidfuscatorJar = "C:\\tools\\skidfuscator.jar" // ← Pfad anpassen

    commandLine 'java', '-jar', skidfuscatorJar,
            'obfuscate',
            '--input',  inputJar,
            '--output', outputJar,
            '--libs',   "${System.getProperty('java.home')}/jmods"
}

